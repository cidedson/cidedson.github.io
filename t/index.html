<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tarefa recebida · TDAH na Vida Real</title>
<style>
:root { --bg: #f4f3ef; --card: #fdfcf9; --ink: #17201e; --muted: #55605c; --line: #eceae3; --accent: #1f5f5b; --soft: #dcebe8; --warn: #8a3a14; --warn-soft: #fbe6da; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1716; --card: #182220; --ink: #e8eeec; --muted: #9aa9a5; --line: #26322f; --accent: #6fc2b8; --soft: #1e3532; --warn: #f4b08e; --warn-soft: #3a2a20; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-size: 24px; margin: 6px 0 4px; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 14px; }
.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); margin-right: 6px; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
ol { margin: 6px 0 0; padding-left: 22px; } li { margin: 6px 0; }
.btn { display: block; width: 100%; text-align: center; text-decoration: none; font-weight: 800; font-size: 16px; border-radius: 16px; padding: 15px; margin-top: 16px; background: var(--accent); color: var(--card); border: 0; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); font-size: 15px; padding: 12px; margin-top: 10px; }
.small { font-size: 14px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">TDAH na Vida Real · tarefa recebida</p>
  <div id="conteudo"><h1>Abrindo a tarefa…</h1></div>
</main>
<script>
(function () {
  var PKG = 'com.cidedson.tdahvidareal';
  var el = document.getElementById('conteudo');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function codeFromUrl() {
    var h = location.hash.slice(1);
    if (h) return decodeURIComponent(h);
    var m = /[?&]d=([^&#]+)/.exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function unb64(str) {
    var b = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4));
    var out = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) out[i] = b.charCodeAt(i); return out;
  }
  function decode(code) {
    var bytes = unb64(code.slice(1));
    if (code[0] !== 'z') return Promise.resolve(new TextDecoder().decode(bytes));
    var s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(s).arrayBuffer().then(function (buf) { return new TextDecoder().decode(buf); });
  }
  var QUADS = { q1: 'Faz hoje', q2: 'Agenda', q3: 'Rápido ou repassa', q4: 'Solta' };
  function quad(t) {
    if (t.imp !== true && t.imp !== false) return '';
    var urg = t.urg === true;
    if (!urg && /^\d{4}-\d{2}-\d{2}$/.test(t.deadline || '')) { var p = t.deadline.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); var hoje = new Date(); hoje.setHours(0, 0, 0, 0); urg = (d - hoje) / 864e5 <= 1; }
    return t.imp && urg ? 'q1' : t.imp ? 'q2' : urg ? 'q3' : 'q4';
  }
  function prazo(t) { if (!/^\d{4}-\d{2}-\d{2}$/.test(t.deadline || '')) return ''; var p = t.deadline.split('-'); return (t.time ? '' : 'prazo ') + p[2] + '/' + p[1] + (t.time ? ' · ' + t.time : ''); }
  var DS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  function repete(r) { if (!r || !r.kind) return ''; if (r.kind === 'dia') return 'todo dia'; if (r.kind === 'mes') return 'todo dia ' + r.dom; var d = (r.days || []).slice().sort(); return d.join() === '1,2,3,4,5' ? 'dias úteis' : 'toda ' + d.map(function (x) { return DS[x]; }).join(', '); }
  var code = codeFromUrl();
  if (!code) { el.innerHTML = '<h1>Link incompleto</h1><p class="muted">Peça para mandarem a tarefa de novo.</p>'; return; }
  decode(code).then(function (txt) {
    var data = JSON.parse(txt), t = data.tarefa || {};
    var q = quad(t), passos = (t.steps || []).filter(function (s) { return s && s.t; });
    var intent = 'intent://cidedson.github.io/t/?d=' + encodeURIComponent(code) + '#Intent;scheme=https;package=' + PKG + ';end';
    var texto = [t.title, t.what ? 'Pronto quando: ' + t.what : '', prazo(t), t.place ? 'Local: ' + t.place : '', repete(t.rep) ? 'Repete: ' + repete(t.rep) : ''].concat(passos.map(function (s, i) { return (i + 1) + '. ' + s.t + (s.est ? ' (' + s.est + ' min)' : ''); })).filter(Boolean).join('\n');
    el.innerHTML =
      '<h1>' + esc(t.title) + '</h1>' +
      '<p class="muted">' + (data.de ? esc(data.de) + ' te mandou esta tarefa.' : 'Alguém te mandou esta tarefa.') + '</p>' +
      '<div>' + (q ? '<span class="chip' + (q === 'q1' ? ' warn' : '') + '">' + QUADS[q] + '</span>' : '') + (prazo(t) ? '<span class="chip">' + prazo(t) + '</span>' : '') + (t.place ? '<span class="chip">' + esc(t.place) + '</span>' : '') + (repete(t.rep) ? '<span class="chip">↻ ' + repete(t.rep) + '</span>' : '') + '</div>' +
      (t.what ? '<div class="card"><p class="eyebrow">Pronto quando</p><p style="margin:4px 0 0">' + esc(t.what) + '</p></div>' : '') +
      (passos.length ? '<div class="card"><p class="eyebrow">Passos</p><ol>' + passos.map(function (s) { return '<li>' + esc(s.t) + (s.est ? ' <span class="muted">(' + esc(s.est) + ' min)</span>' : '') + '</li>'; }).join('') + '</ol></div>' : '') +
      '<a class="btn" href="' + intent + '">Abrir no app TDAH na Vida Real</a>' +
      '<button class="btn ghost" id="copiar">Copiar a tarefa como texto</button>' +
      '<p class="small muted" style="margin-top:16px">Não tem o app? Ele é só para Android: peça o arquivo de instalação para quem te mandou o link.</p>';
    document.getElementById('copiar').onclick = function () { navigator.clipboard.writeText(texto).then(function () { document.getElementById('copiar').textContent = 'Copiado'; }); };
  }).catch(function () { el.innerHTML = '<h1>Link incompleto</h1><p class="muted">Peça para mandarem a tarefa de novo.</p>'; });
})();
</script>
</body>
</html>
